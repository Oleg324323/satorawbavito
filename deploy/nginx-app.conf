server {
    listen 80;
    server_name app.comcookie.store;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/satorna-acme;
        try_files $uri =404;
    }
    location / { return 301 https://app.comcookie.store$request_uri; }
}

server {
    listen 443 ssl;
    server_name app.comcookie.store;
    ssl_certificate /etc/letsencrypt/live/app.comcookie.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.comcookie.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/satorna-frontend/current;
    access_log /var/log/nginx/app.comcookie.store.access.log;
    error_log /var/log/nginx/app.comcookie.store.error.log;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location ~ ^/(api(?:/|$)|health(?:/|$)) {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }

    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/index.html /index.html;
    }
}
